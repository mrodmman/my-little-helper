name: Publish Resend Email Templates

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish all Resend templates
    runs-on: ubuntu-latest
    env:
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Verify RESEND_API_KEY secret
        shell: bash
        run: |
          if [ -z "$RESEND_API_KEY" ]; then
            echo "RESEND_API_KEY GitHub Actions secret is missing."
            exit 1
          fi

      - name: Discover and publish all email template flows
        shell: bash
        run: |
          set -euo pipefail

          # Find every import-and-publish.js under email-templates/ and run each one.
          # To add a new email flow: drop a new folder with import-and-publish.js and push.
          # No changes to this workflow file are ever needed.

          found=0
          while IFS= read -r script; do
            folder="$(dirname "$script")"
            echo ""
            echo "========================================"
            echo "Flow: $folder"
            echo "========================================"
            pushd "$folder" >/dev/null
            npm install --silent
            node import-and-publish.js
            popd >/dev/null
            found=$((found + 1))
          done < <(find email-templates -name "import-and-publish.js" | sort)

          echo ""
          echo "========================================"
          echo "Done — ran $found template flow(s)"
          echo "========================================"
