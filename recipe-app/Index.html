<!DOCTYPE html>
<html lang="en">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Recipe Book</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ── Reset & tokens ─────────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:    #faf7f2;
      --warm:     #f5ede0;
      --parchment:#ede3d4;
      --rust:     #c0633a;
      --rust-d:   #a04f2d;
      --rust-l:   #e8956e;
      --olive:    #6b7a3d;
      --charcoal: #2a2420;
      --ink:      #3d3530;
      --muted:    #8c7b6e;
      --divider:  rgba(0,0,0,.10);
      --shadow-s: 0 2px 8px rgba(0,0,0,.08);
      --shadow-m: 0 8px 28px rgba(0,0,0,.12);
      --shadow-l: 0 20px 50px rgba(0,0,0,.16);
      --radius-s: 14px;
      --radius-m: 22px;
      --radius-l: 32px;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-sans:  'Inter', system-ui, sans-serif;
      --transition: .2s cubic-bezier(.4,0,.2,1);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: var(--font-sans);
      background-color: var(--cream);
      background-image:
        radial-gradient(ellipse 80% 50% at 10% -10%, rgba(192,99,58,.10) 0%, transparent 60%),
        radial-gradient(ellipse 60% 40% at 90% 110%,  rgba(107,122,61,.08) 0%, transparent 50%);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Layout ─────────────────────────────────────────────────────────── */
    .app     { max-width: 1180px; margin: 0 auto; padding: 28px 22px 60px; }
    .hidden  { display: none !important; }
    .visible { display: block !important; }

    /* ── Header ─────────────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 36px;
      padding-bottom: 28px;
      border-bottom: 1.5px solid var(--parchment);
    }

    .brand-title {
      font-family: var(--font-serif);
      font-size: clamp(36px, 5vw, 56px);
      color: var(--charcoal);
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .brand-title span {
      color: var(--rust);
    }

    .brand-sub {
      margin-top: 6px;
      font-size: 14px;
      color: var(--muted);
      letter-spacing: .04em;
      text-transform: uppercase;
    }

    .sheet-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1.5px solid var(--parchment);
      transition: var(--transition);
      white-space: nowrap;
    }

    .sheet-link:hover { color: var(--rust); border-color: var(--rust-l); }

    /* ── Search ─────────────────────────────────────────────────────────── */
    .search-wrap {
      position: relative;
      margin-bottom: 28px;
    }

    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .search {
      width: 100%;
      padding: 16px 18px 16px 50px;
      border-radius: var(--radius-m);
      border: 1.5px solid var(--parchment);
      background: #fff;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 16px;
      outline: none;
      box-shadow: var(--shadow-s);
      transition: var(--transition);
    }

    .search:focus {
      border-color: var(--rust-l);
      box-shadow: 0 0 0 3px rgba(192,99,58,.12), var(--shadow-s);
    }

    .search::placeholder { color: var(--muted); }

    /* ── Category pills ──────────────────────────────────────────────────── */
    .section-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      margin-bottom: 32px;
      scrollbar-width: none;
    }
    .categories::-webkit-scrollbar { display: none; }

    .cat {
      flex-shrink: 0;
      padding: 9px 18px;
      border-radius: 999px;
      border: 1.5px solid var(--parchment);
      background: #fff;
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
    }

    .cat:hover { border-color: var(--rust-l); color: var(--rust); }

    .cat.active {
      background: var(--rust);
      border-color: var(--rust);
      color: #fff;
      box-shadow: 0 4px 14px rgba(192,99,58,.35);
    }

    /* ── Recipe grid ─────────────────────────────────────────────────────── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px;
    }

    .recipe-card {
      background: #fff;
      border-radius: var(--radius-m);
      overflow: hidden;
      cursor: pointer;
      box-shadow: var(--shadow-s);
      border: 1.5px solid var(--parchment);
      transition: transform var(--transition), box-shadow var(--transition), border-color var(--transition);
    }

    .recipe-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-m);
      border-color: var(--rust-l);
    }

    .card-img {
      height: 170px;
      background: linear-gradient(135deg, var(--warm), var(--parchment));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 52px;
      overflow: hidden;
      position: relative;
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .4s ease;
    }

    .recipe-card:hover .card-img img {
      transform: scale(1.04);
    }

    .card-body { padding: 18px 18px 20px; }

    .card-category {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--rust);
      margin-bottom: 7px;
    }

    .card-title {
      font-family: var(--font-serif);
      font-size: 21px;
      color: var(--charcoal);
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .card-meta {
      display: flex;
      gap: 14px;
      font-size: 13px;
      color: var(--muted);
    }

    .card-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* ── Skeleton loader ─────────────────────────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: -600px 0; }
      100% { background-position:  600px 0; }
    }

    .skeleton {
      background: linear-gradient(90deg, var(--warm) 25%, var(--parchment) 50%, var(--warm) 75%);
      background-size: 600px 100%;
      animation: shimmer 1.4s infinite linear;
      border-radius: 8px;
    }

    .skeleton-card {
      background: #fff;
      border-radius: var(--radius-m);
      overflow: hidden;
      border: 1.5px solid var(--parchment);
    }

    .skeleton-img  { height: 170px; }
    .skeleton-body { padding: 18px; }
    .skeleton-line { height: 14px; margin-bottom: 10px; }
    .skeleton-line.short { width: 55%; }
    .skeleton-line.medium { width: 80%; }

    /* ── Detail view ─────────────────────────────────────────────────────── */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #fff;
      border: 1.5px solid var(--parchment);
      color: var(--ink);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 600;
      padding: 10px 18px;
      border-radius: var(--radius-s);
      cursor: pointer;
      margin-bottom: 24px;
      box-shadow: var(--shadow-s);
      transition: var(--transition);
    }

    .back-btn:hover { border-color: var(--rust-l); color: var(--rust); }

    /* hero */
    .hero {
      border-radius: var(--radius-l);
      overflow: hidden;
      background: #fff;
      border: 1.5px solid var(--parchment);
      box-shadow: var(--shadow-m);
      margin-bottom: 24px;
    }

    .hero-img {
      height: 280px;
      background: linear-gradient(135deg, var(--warm) 0%, var(--parchment) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 80px;
      overflow: hidden;
    }

    .hero-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-body { padding: 28px 32px 32px; }

    .hero-category {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      color: var(--rust);
      margin-bottom: 8px;
    }

    .hero-title {
      font-family: var(--font-serif);
      font-size: clamp(28px, 4vw, 42px);
      color: var(--charcoal);
      line-height: 1.15;
      margin-bottom: 14px;
    }

    .hero-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 18px;
    }

    .stat-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--warm);
      border: 1.5px solid var(--parchment);
      border-radius: 999px;
      padding: 7px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--ink);
    }

    .stat-chip svg { color: var(--rust); flex-shrink: 0; }

    .hero-description {
      font-size: 16px;
      line-height: 1.7;
      color: var(--muted);
      max-width: 700px;
    }

    /* two-column detail */
    .detail-cols {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    /* panel */
    .panel {
      background: #fff;
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius-m);
      padding: 24px;
      box-shadow: var(--shadow-s);
    }

    .panel-title {
      font-family: var(--font-serif);
      font-size: 22px;
      color: var(--charcoal);
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1.5px solid var(--parchment);
    }

    /* ingredients */
    .ingredient {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 11px 0;
      border-bottom: 1px solid var(--divider);
      cursor: pointer;
      transition: opacity var(--transition);
    }

    .ingredient:last-of-type { border-bottom: 0; }

    .ingredient input[type="checkbox"] {
      width: 20px;
      height: 20px;
      accent-color: var(--olive);
      cursor: pointer;
      flex-shrink: 0;
    }

    .ingredient span {
      font-size: 15px;
      line-height: 1.4;
      transition: var(--transition);
    }

    .ingredient.checked span {
      text-decoration: line-through;
      color: var(--muted);
    }

    .ingredient.checked { opacity: .65; }

    .reset-btn {
      display: block;
      width: 100%;
      margin-top: 18px;
      padding: 12px;
      background: var(--warm);
      border: 1.5px solid var(--parchment);
      border-radius: var(--radius-s);
      font-family: var(--font-sans);
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
      cursor: pointer;
      transition: var(--transition);
      letter-spacing: .02em;
    }

    .reset-btn:hover { background: var(--parchment); border-color: var(--rust-l); color: var(--rust); }

    /* steps */
    .step {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 14px;
      padding: 14px 0;
      border-bottom: 1px solid var(--divider);
      line-height: 1.6;
    }

    .step:last-child { border-bottom: 0; }

    .step-num {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--warm);
      border: 2px solid var(--rust-l);
      color: var(--rust);
      font-weight: 800;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      margin-top: 2px;
    }

    .step-text { font-size: 15px; color: var(--ink); padding-top: 6px; }

    /* ── Progress bar on ingredient panel ───────────────────────────────── */
    .progress-wrap {
      height: 6px;
      background: var(--warm);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--olive), #8da04a);
      border-radius: 999px;
      transition: width .4s cubic-bezier(.4,0,.2,1);
    }

    /* ── Toast ───────────────────────────────────────────────────────────── */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: var(--charcoal);
      color: #fff;
      padding: 12px 22px;
      border-radius: 999px;
      font-size: 14px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s, transform .25s;
      z-index: 9999;
      white-space: nowrap;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Empty / error states ────────────────────────────────────────────── */
    .empty {
      padding: 32px 0 8px;
      color: var(--muted);
      font-size: 15px;
      text-align: center;
    }

    .error-msg {
      padding: 40px 20px;
      text-align: center;
      color: var(--rust);
    }

    .error-msg strong { font-family: var(--font-serif); font-size: 22px; display: block; margin-bottom: 8px; }

    /* ── Responsive ──────────────────────────────────────────────────────── */
    @media (max-width: 880px) {
      .detail-cols {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .app { padding: 18px 14px 48px; }
      .header { flex-direction: column; align-items: flex-start; gap: 12px; }
      .hero-body { padding: 20px; }
      .panel { padding: 18px; }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- ── List view ───────────────────────────────────────────────────── -->
    <div id="listView" class="hidden">

      <div class="header">
        <div>
          <h1 class="brand-title">My <span>Recipe</span> Book</h1>
          <p class="brand-sub">Search · filter · cook · check it off</p>
        </div>
        <a id="sheetLink" class="sheet-link" href="#" target="_blank">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 21V9"/></svg>
          Open Sheet
        </a>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <input id="searchInput" class="search" type="search" placeholder="Search recipes…" oninput="renderRecipes()">
      </div>

      <p class="section-label">Categories</p>
      <div id="categories" class="categories"></div>

      <p class="section-label">Recipes</p>
      <div id="recipesGrid" class="grid"></div>
    </div>

    <!-- ── Detail view ─────────────────────────────────────────────────── -->
    <div id="detailView" class="hidden"></div>

    <!-- ── Loading skeletons ───────────────────────────────────────────── -->
    <div id="loading">
      <div class="header">
        <div>
          <h1 class="brand-title">My <span>Recipe</span> Book</h1>
          <p class="brand-sub">Search · filter · cook · check it off</p>
        </div>
      </div>
      <div class="grid">
        ${[...Array(6)].map(() => `
          <div class="skeleton-card">
            <div class="skeleton skeleton-img"></div>
            <div class="skeleton-body">
              <div class="skeleton skeleton-line short"></div>
              <div class="skeleton skeleton-line medium"></div>
              <div class="skeleton skeleton-line short"></div>
            </div>
          </div>
        `).join("")}
      </div>
    </div>

  </div>

  <!-- ── Toast ──────────────────────────────────────────────────────────── -->
  <div id="toast"></div>

  <script>
    /* ── State ─────────────────────────────────────────────────────────── */
    let appData = { recipes: [], ingredients: [], steps: [] };
    let selectedCategory = "All";
    let toastTimer = null;

    /* ── Boot ──────────────────────────────────────────────────────────── */
    document.addEventListener("DOMContentLoaded", () => {
      google.script.run
        .withSuccessHandler(data => {
          appData = normalizeData(data);
          hide("loading");
          show("listView");
          renderCategories();
          renderRecipes();
        })
        .withFailureHandler(err => {
          document.getElementById("loading").innerHTML =
            `<div class="error-msg"><strong>Couldn't load recipes</strong>${escapeHtml(err.message)}</div>`;
        })
        .getRecipeAppData();

      // Populate sheet link (silently ignore if fails)
      google.script.run
        .withSuccessHandler(url => {
          const el = document.getElementById("sheetLink");
          if (el && url) el.href = url;
        })
        .getSheetUrl();
    });

    /* ── Data helpers ──────────────────────────────────────────────────── */
    function normalizeData(data) {
      return {
        recipes: data.recipes || [],
        ingredients: (data.ingredients || []).map(i => ({
          ...i,
          Checked: i.Checked === true || String(i.Checked).toUpperCase() === "TRUE"
        })),
        steps: data.steps || []
      };
    }

    function getId(recipe)    { return recipe["RecipeID"]; }
    function getName(recipe)  { return recipe["Recipe Name"] || "Untitled Recipe"; }
    function getImage(recipe) { return recipe["Recipe Image"] || ""; }

    function getEmoji(category) {
      const c = String(category || "").toLowerCase();
      if (c.includes("breakfast")) return "🥞";
      if (c.includes("lunch"))     return "🥗";
      if (c.includes("dinner"))    return "🍝";
      if (c.includes("dessert"))   return "🍪";
      if (c.includes("snack"))     return "🥨";
      if (c.includes("soup"))      return "🍲";
      if (c.includes("salad"))     return "🥙";
      if (c.includes("main"))      return "🍽️";
      return "🍴";
    }

    /* ── DOM helpers ───────────────────────────────────────────────────── */
    function show(id) { document.getElementById(id).classList.remove("hidden"); }
    function hide(id) { document.getElementById(id).classList.add("hidden"); }

    function toast(msg) {
      clearTimeout(toastTimer);
      const el = document.getElementById("toast");
      el.textContent = msg;
      el.classList.add("show");
      toastTimer = setTimeout(() => el.classList.remove("show"), 2200);
    }

    /* ── Render: categories ────────────────────────────────────────────── */
    function renderCategories() {
      const cats = ["All", ...new Set(appData.recipes.map(r => r.Category).filter(Boolean))];
      document.getElementById("categories").innerHTML = cats.map(cat => `
        <button class="cat ${cat === selectedCategory ? "active" : ""}"
          onclick="selectCategory(${JSON.stringify(cat)})">
          ${escapeHtml(cat)}
        </button>
      `).join("");
    }

    function selectCategory(cat) {
      selectedCategory = cat;
      renderCategories();
      renderRecipes();
    }

    /* ── Render: recipe grid ───────────────────────────────────────────── */
    function renderRecipes() {
      const search = document.getElementById("searchInput").value.toLowerCase().trim();
      const grid   = document.getElementById("recipesGrid");

      const recipes = appData.recipes.filter(r => {
        const name = getName(r).toLowerCase();
        const cat  = String(r.Category || "").toLowerCase();
        const desc = String(r.Description || "").toLowerCase();
        const matchSearch = !search || name.includes(search) || cat.includes(search) || desc.includes(search);
        const matchCat    = selectedCategory === "All" || r.Category === selectedCategory;
        return matchSearch && matchCat;
      });

      if (!recipes.length) {
        grid.innerHTML = `<div class="empty">No recipes found — try a different search or category.</div>`;
        return;
      }

      grid.innerHTML = recipes.map(r => {
        const img   = getImage(r);
        const emoji = getEmoji(r.Category);
        const prep  = r["Prep Time"] || "";
        const servings = r["Servings"] || "";

        return `
          <article class="recipe-card" onclick="openRecipe(${JSON.stringify(String(getId(r)))})"
            role="button" tabindex="0"
            onkeydown="if(event.key==='Enter')openRecipe(${JSON.stringify(String(getId(r)))})">
            <div class="card-img">
              ${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(getName(r))}" loading="lazy">` : emoji}
            </div>
            <div class="card-body">
              <div class="card-category">${escapeHtml(r.Category || "")}</div>
              <h2 class="card-title">${escapeHtml(getName(r))}</h2>
              <div class="card-meta">
                ${prep ? `<span class="card-meta-item">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                  ${escapeHtml(prep)}</span>` : ""}
                ${servings ? `<span class="card-meta-item">
                  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
                  ${escapeHtml(String(servings))}</span>` : ""}
              </div>
            </div>
          </article>
        `;
      }).join("");
    }

    /* ── Recipe detail ─────────────────────────────────────────────────── */
    function openRecipe(recipeId) {
      const recipe = appData.recipes.find(r => String(getId(r)) === recipeId);
      if (!recipe) return;

      const ingredients = appData.ingredients.filter(i => String(i.RecipeID) === recipeId);
      const steps = appData.steps
        .filter(s => String(s.RecipeID) === recipeId)
        .sort((a, b) => Number(a["Step Number"]) - Number(b["Step Number"]));

      const img    = getImage(recipe);
      const emoji  = getEmoji(recipe.Category);
      const prep   = recipe["Prep Time"]  || "";
      const cook   = recipe["Cook Time"]  || "";
      const total  = recipe["Total Time"] || "";
      const serves = recipe["Servings"]   || "";

      const checkedCount = ingredients.filter(i => i.Checked).length;
      const pct = ingredients.length ? Math.round((checkedCount / ingredients.length) * 100) : 0;

      hide("listView");
      const detail = document.getElementById("detailView");
      show("detailView");

      detail.innerHTML = `
        <button class="back-btn" onclick="backToList()">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
          All recipes
        </button>

        <div class="hero">
          <div class="hero-img">
            ${img ? `<img src="${escapeHtml(img)}" alt="${escapeHtml(getName(recipe))}">` : emoji}
          </div>
          <div class="hero-body">
            <div class="hero-category">${escapeHtml(recipe.Category || "")}</div>
            <h1 class="hero-title">${escapeHtml(getName(recipe))}</h1>
            <div class="hero-stats">
              ${prep   ? statChip("⏱", prep,  "Prep")  : ""}
              ${cook   ? statChip("🔥", cook,  "Cook")  : ""}
              ${total  ? statChip("⏰", total, "Total") : ""}
              ${serves ? statChip("👥", String(serves), "Serves") : ""}
            </div>
            ${recipe.Description ? `<p class="hero-description">${escapeHtml(recipe.Description)}</p>` : ""}
          </div>
        </div>

        <div class="detail-cols">
          <!-- Ingredients -->
          <div class="panel">
            <h2 class="panel-title">Ingredients</h2>
            ${ingredients.length ? `
              <div class="progress-wrap">
                <div class="progress-bar" id="ingProgress" style="width:${pct}%"></div>
              </div>
              ${ingredients.map(i => `
                <label class="ingredient${i.Checked ? " checked" : ""}" id="ing-${escapeHtml(String(i.IngredientID))}">
                  <input type="checkbox" ${i.Checked ? "checked" : ""}
                    onchange="toggleIngredient(${JSON.stringify(String(i.IngredientID))}, this.checked, ${JSON.stringify(recipeId)})">
                  <span>${escapeHtml(i.Ingredient || "")}</span>
                </label>
              `).join("")}
              <button class="reset-btn" onclick="resetIngredients(${JSON.stringify(recipeId)})">↺ Reset checklist</button>
            ` : `<div class="empty">No ingredients listed yet.</div>`}
          </div>

          <!-- Steps -->
          <div class="panel">
            <h2 class="panel-title">Method</h2>
            ${steps.length ? steps.map(s => `
              <div class="step">
                <div class="step-num">${escapeHtml(String(s["Step Number"] || ""))}</div>
                <div class="step-text">${escapeHtml(s.Instruction || "")}</div>
              </div>
            `).join("") : `<div class="empty">No steps listed yet.</div>`}
          </div>
        </div>
      `;

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function statChip(icon, value, label) {
      return `
        <span class="stat-chip">
          <span>${icon}</span>
          <strong>${escapeHtml(value)}</strong>
          <span style="color:var(--muted);font-weight:400">${label}</span>
        </span>
      `;
    }

    function backToList() {
      hide("detailView");
      show("listView");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    /* ── Ingredient logic ──────────────────────────────────────────────── */
    function toggleIngredient(ingredientId, checked, recipeId) {
      const item = appData.ingredients.find(i => String(i.IngredientID) === ingredientId);
      if (item) item.Checked = checked;

      const row = document.getElementById("ing-" + ingredientId);
      if (row) row.classList.toggle("checked", checked);

      updateProgress(recipeId);
      toast(checked ? "✓ Checked off" : "Unchecked");

      google.script.run
        .withFailureHandler(err => toast("⚠ " + err.message))
        .updateIngredientChecked(ingredientId, checked);
    }

    function resetIngredients(recipeId) {
      appData.ingredients.forEach(i => {
        if (String(i.RecipeID) === recipeId) i.Checked = false;
      });

      google.script.run
        .withSuccessHandler(() => { openRecipe(recipeId); toast("Checklist reset"); })
        .withFailureHandler(err => toast("⚠ " + err.message))
        .resetRecipeIngredients(recipeId);
    }

    function updateProgress(recipeId) {
      const ings = appData.ingredients.filter(i => String(i.RecipeID) === recipeId);
      if (!ings.length) return;
      const pct = Math.round(ings.filter(i => i.Checked).length / ings.length * 100);
      const bar = document.getElementById("ingProgress");
      if (bar) bar.style.width = pct + "%";
    }

    /* ── Sanitize ──────────────────────────────────────────────────────── */
    function escapeHtml(v) {
      return String(v ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
